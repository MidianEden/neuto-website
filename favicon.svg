<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Neuto robot favicon">
  <defs>
    <linearGradient id="bg" x1="18%" y1="18%" x2="82%" y2="82%">
      <stop offset="0%" stop-color="#464646" />
      <stop offset="100%" stop-color="#3b3b3b" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="44%" r="34%">
      <stop offset="0%" stop-color="#4fbfff" stop-opacity="0.52" />
      <stop offset="65%" stop-color="#1e6fe5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1e6fe5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shell" x1="18%" y1="18%" x2="78%" y2="88%">
      <stop offset="0%" stop-color="#76deff" />
      <stop offset="45%" stop-color="#40b7ff" />
      <stop offset="100%" stop-color="#167fe0" />
    </linearGradient>
    <linearGradient id="ear" x1="50%" y1="0%" x2="50%" y2="100%">
